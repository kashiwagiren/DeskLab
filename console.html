<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>DeskLab - Debug Console</title>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      body {
        font-family: "Consolas", "Monaco", monospace;
        background: #1a1a1a;
        color: #e0e0e0;
        height: 100vh;
        display: flex;
        flex-direction: column;
      }

      .header {
        background: #2d2d2d;
        padding: 15px 20px;
        border-bottom: 2px solid #667eea;
        display: flex;
        justify-content: space-between;
        align-items: center;
      }

      .header h1 {
        color: #667eea;
        font-size: 1.2em;
        font-weight: 600;
      }

      .header-actions {
        display: flex;
        gap: 10px;
      }

      .btn {
        padding: 8px 16px;
        border: none;
        border-radius: 4px;
        cursor: pointer;
        font-size: 0.9em;
        font-weight: 600;
        transition: all 0.2s;
      }

      .btn-clear {
        background: #ed8936;
        color: white;
      }

      .btn-clear:hover {
        background: #dd6b20;
      }

      .btn-export {
        background: #4299e1;
        color: white;
      }

      .btn-export:hover {
        background: #3182ce;
      }

      .btn-test {
        background: #48bb78;
        color: white;
      }

      .btn-test:hover {
        background: #38a169;
      }

      .console-container {
        flex: 1;
        padding: 20px;
        overflow-y: auto;
        background: #1a1a1a;
      }

      .log-entry {
        padding: 8px 12px;
        margin: 4px 0;
        border-left: 3px solid transparent;
        border-radius: 3px;
        font-size: 0.9em;
        line-height: 1.5;
      }

      .log-info {
        background: #1e3a5f;
        border-left-color: #4299e1;
        color: #90cdf4;
      }

      .log-success {
        background: #1e4d2b;
        border-left-color: #48bb78;
        color: #9ae6b4;
      }

      .log-warning {
        background: #4a3520;
        border-left-color: #ed8936;
        color: #fbd38d;
      }

      .log-error {
        background: #4a1f1f;
        border-left-color: #f56565;
        color: #fc8181;
      }

      .log-debug {
        background: #2d2d2d;
        border-left-color: #a0aec0;
        color: #cbd5e0;
      }

      .timestamp {
        color: #718096;
        font-size: 0.85em;
        margin-right: 10px;
      }

      .log-type {
        font-weight: bold;
        margin-right: 10px;
        text-transform: uppercase;
        font-size: 0.8em;
      }

      .filter-bar {
        background: #2d2d2d;
        padding: 15px 20px;
        border-bottom: 1px solid #3d3d3d;
        display: flex;
        gap: 15px;
        align-items: center;
      }

      .filter-bar label {
        color: #a0aec0;
        font-size: 0.9em;
      }

      .filter-bar select {
        background: #1a1a1a;
        color: #e0e0e0;
        border: 1px solid #4a5568;
        padding: 6px 12px;
        border-radius: 4px;
        font-family: inherit;
      }

      .stats {
        display: flex;
        gap: 20px;
        margin-left: auto;
        font-size: 0.85em;
      }

      .stat {
        color: #a0aec0;
      }

      .stat-value {
        color: #667eea;
        font-weight: bold;
        margin-left: 5px;
      }

      .code-block {
        background: #0d1117;
        padding: 10px;
        border-radius: 4px;
        margin: 5px 0;
        overflow-x: auto;
      }

      .empty-console {
        text-align: center;
        padding: 60px 20px;
        color: #718096;
      }

      .empty-console-icon {
        font-size: 3em;
        margin-bottom: 20px;
      }
    </style>
  </head>
  <body>
    <div class="header">
      <h1>🔍 DeskLab Debug Console</h1>
      <div class="header-actions">
        <button class="btn btn-test" onclick="runTests()">Run Tests</button>
        <button class="btn btn-export" onclick="exportLogs()">Export</button>
        <button class="btn btn-clear" onclick="clearConsole()">Clear</button>
      </div>
    </div>

    <div class="filter-bar">
      <label>Filter:</label>
      <select id="filterType" onchange="filterLogs()">
        <option value="all">All Logs</option>
        <option value="info">Info</option>
        <option value="success">Success</option>
        <option value="warning">Warning</option>
        <option value="error">Error</option>
        <option value="debug">Debug</option>
      </select>

      <div class="stats">
        <div class="stat">
          Total: <span class="stat-value" id="totalCount">0</span>
        </div>
        <div class="stat">
          Errors: <span class="stat-value" id="errorCount">0</span>
        </div>
      </div>
    </div>

    <div class="console-container" id="consoleContainer">
      <div class="empty-console">
        <div class="empty-console-icon">📝</div>
        <p>Console is empty. Run some tests or perform actions to see logs.</p>
      </div>
    </div>

    <script>
      let logs = [];
      let totalErrors = 0;

      // Intercept console methods
      const originalLog = console.log;
      const originalError = console.error;
      const originalWarn = console.warn;
      const originalInfo = console.info;

      console.log = function (...args) {
        originalLog.apply(console, args);
        addLog("info", args);
      };

      console.error = function (...args) {
        originalError.apply(console, args);
        addLog("error", args);
      };

      console.warn = function (...args) {
        originalWarn.apply(console, args);
        addLog("warning", args);
      };

      console.info = function (...args) {
        originalInfo.apply(console, args);
        addLog("info", args);
      };

      // Add log entry
      function addLog(type, args) {
        const timestamp = new Date().toLocaleTimeString();
        const message = args
          .map((arg) => {
            if (typeof arg === "object") {
              return JSON.stringify(arg, null, 2);
            }
            return String(arg);
          })
          .join(" ");

        logs.push({ type, timestamp, message });

        if (type === "error") totalErrors++;

        renderLogs();
        updateStats();
      }

      // Manual log functions
      function log(message, type = "info") {
        const timestamp = new Date().toLocaleTimeString();
        logs.push({ type, timestamp, message });

        if (type === "error") totalErrors++;

        renderLogs();
        updateStats();
      }

      // Render logs
      function renderLogs() {
        const container = document.getElementById("consoleContainer");
        const filter = document.getElementById("filterType").value;

        const filteredLogs =
          filter === "all" ? logs : logs.filter((l) => l.type === filter);

        if (filteredLogs.length === 0) {
          container.innerHTML = `
                    <div class="empty-console">
                        <div class="empty-console-icon">📝</div>
                        <p>${
                          filter === "all"
                            ? "Console is empty."
                            : "No " + filter + " logs."
                        }</p>
                    </div>
                `;
          return;
        }

        container.innerHTML = filteredLogs
          .map(
            (log) => `
                <div class="log-entry log-${log.type}">
                    <span class="timestamp">${log.timestamp}</span>
                    <span class="log-type">${log.type}</span>
                    <span class="message">${escapeHtml(log.message)}</span>
                </div>
            `
          )
          .join("");

        // Auto-scroll to bottom
        container.scrollTop = container.scrollHeight;
      }

      // Update stats
      function updateStats() {
        document.getElementById("totalCount").textContent = logs.length;
        document.getElementById("errorCount").textContent = totalErrors;
      }

      // Filter logs
      function filterLogs() {
        renderLogs();
      }

      // Clear console
      function clearConsole() {
        if (confirm("Clear all logs?")) {
          logs = [];
          totalErrors = 0;
          renderLogs();
          updateStats();
        }
      }

      // Export logs
      function exportLogs() {
        const text = logs
          .map(
            (log) =>
              `[${log.timestamp}] [${log.type.toUpperCase()}] ${log.message}`
          )
          .join("\n");

        const blob = new Blob([text], { type: "text/plain" });
        const url = URL.createObjectURL(blob);
        const a = document.createElement("a");
        a.href = url;
        a.download = `desklab-logs-${Date.now()}.txt`;
        a.click();
        URL.revokeObjectURL(url);

        log("Logs exported successfully", "success");
      }

      // Escape HTML
      function escapeHtml(text) {
        const div = document.createElement("div");
        div.textContent = text;
        return div.innerHTML;
      }

      // Run comprehensive tests
      async function runTests() {
        log("=== Starting System Tests ===", "info");

        // Test 1: API Connection
        log("Test 1: Testing API connection...", "info");
        try {
          const response = await fetch("api/test.php");
          const data = await response.json();
          if (data.success) {
            log("✓ API Connection: OK", "success");
          } else {
            log("✗ API Connection: Failed", "error");
          }
        } catch (error) {
          log("✗ API Connection Error: " + error.message, "error");
        }

        // Test 2: Database Connection
        log("Test 2: Testing database connection...", "info");
        try {
          const response = await fetch("api/admin/overview.php");
          const data = await response.json();
          if (data.success) {
            log("✓ Database Connection: OK", "success");
            log(`  - Pending requests: ${data.pending_count}`, "debug");
            log(`  - Active users: ${data.active_count}`, "debug");
          } else {
            log("✗ Database Connection: Failed", "error");
          }
        } catch (error) {
          log("✗ Database Error: " + error.message, "error");
        }

        // Test 3: Get Rooms
        log("Test 3: Testing get rooms...", "info");
        try {
          const response = await fetch("api/get_rooms.php");
          const data = await response.json();
          if (data.success) {
            log(`✓ Get Rooms: Found ${data.rooms.length} rooms`, "success");
            if (data.rooms.length > 0) {
              log(`  - Rooms: ${data.rooms.join(", ")}`, "debug");
            }
          } else {
            log("✗ Get Rooms: Failed", "error");
          }
        } catch (error) {
          log("✗ Get Rooms Error: " + error.message, "error");
        }

        // Test 4: Get Classes
        log("Test 4: Testing get classes...", "info");
        try {
          const response = await fetch("api/admin/classes.php");
          const data = await response.json();
          if (data.success) {
            log(
              `✓ Get Classes: Found ${data.classes.length} classes`,
              "success"
            );
          } else {
            log("✗ Get Classes: Failed", "error");
          }
        } catch (error) {
          log("✗ Get Classes Error: " + error.message, "error");
        }

        // Test 5: Check file permissions
        log("Test 5: Checking file structure...", "info");
        const requiredFiles = [
          "index.html",
          "admin.html",
          "session.html",
          "api/login.php",
          "api/schedule.php",
        ];

        for (const file of requiredFiles) {
          try {
            const response = await fetch(file, { method: "HEAD" });
            if (response.ok) {
              log(`✓ File exists: ${file}`, "success");
            } else {
              log(`✗ File missing: ${file}`, "error");
            }
          } catch (error) {
            log(`✗ Cannot access: ${file}`, "error");
          }
        }

        log("=== Tests Completed ===", "info");
        log(
          `Total errors: ${totalErrors}`,
          totalErrors > 0 ? "warning" : "success"
        );
      }

      // Initial message
      window.addEventListener("load", () => {
        log("DeskLab Debug Console initialized", "success");
        log('Click "Run Tests" to perform system diagnostics', "info");
      });

      // Listen for errors
      window.addEventListener("error", (event) => {
        log(
          `JavaScript Error: ${event.message} at ${event.filename}:${event.lineno}`,
          "error"
        );
      });

      window.addEventListener("unhandledrejection", (event) => {
        log(`Unhandled Promise Rejection: ${event.reason}`, "error");
      });
    </script>
  </body>
</html>
